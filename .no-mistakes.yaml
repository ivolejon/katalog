# .no-mistakes.yaml - no-mistakes gate-konfiguration för katalog
#
# Referens: https://kunchenguid.github.io/no-mistakes/reference/repo-config/
#
# OBS: gate-kontrollfälten (agent, ocr m.fl.) läses ENDAST från den
# betrodda default-branchen (main). Ändringar här måste landa på main för
# att träda i kraft - en pushed branch kan inte försvaga grinden.

# Pipeline-agent: opencode - den inloggade LLM-providern på denna maskin
# (OpenCode Go API). Används också som LLM för ocr-gaten i delegationsläge.
agent: opencode

# OpenCodeReview-gaten direkt efter review. Kräver att den externa `ocr`
#-CLI:n är installerad på daemon-värden:
#   npm install -g @alibaba-group/open-code-review
#
# Delegation (ocr.delegate: true): det deterministiska arbetet (filval +
# regelgrupper) görs av ocr, men själva LLM-granskningen görs av
# pipeline-agenten (opencode) - ingen OCR-egen LLM-konfiguration behövs.
ocr:
  enabled: true
  delegate: true