name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  # Build + test (unit, Testcontainers integration, AppHost smoke). Also registers the
  # GitHub checks that the no-mistakes gate's CI step monitors (generated by
  # `no-mistakes ci-workflow`, extended with the dotnet jobs per arch report 3.9).
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The AppHost SDK build requires the Aspire CLI on PATH (research 3.1: ASPIRE009 otherwise).
      - name: Install Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version 13.5.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore Katalog.slnx

      # TreatWarningsAsErrors is on globally (Directory.Build.props); a warning fails the build.
      - name: Build
        run: dotnet build Katalog.slnx --no-restore -c Release

      # Full solution test run: unit + integration (Testcontainers.PostgreSql + WireMock) +
      # AppHost smoke (DistributedApplicationTestingBuilder). Docker is available on the runner.
      - name: Test
        run: dotnet test Katalog.slnx --no-restore -c Release

  # Committed contracts must match what a fresh build generates (arch report 2.8/3.9).
  contract-drift:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        run: |
          dotnet tool install --global Aspire.Cli --version 13.5.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore Katalog.slnx

      # OpenApiGenerateDocuments is off by default in CI; force it to regenerate the committed
      # contracts, then fail if anything drifted (placeholder appsettings + guards keep the
      # generator host from touching a live Postgres/Spotify).
      - name: Regenerate OpenAPI documents
        run: dotnet build Katalog.slnx --no-restore -c Release /p:OpenApiGenerateDocuments=true

      - name: Fail on contract drift
        run: git diff --exit-code -- contracts/